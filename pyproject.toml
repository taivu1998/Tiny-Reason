[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-reasoning"
version = "0.1.0"
description = "Distilling System 2 reasoning capabilities into Small Language Models."
requires-python = ">=3.9"
dependencies = [
    "numpy<2.0.0",
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "peft>=0.8.0",
    "trl<0.9.0",
    "scipy",
    "sentencepiece",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gpu = ["bitsandbytes>=0.41.0"]
wandb = ["wandb"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
